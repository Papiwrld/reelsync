custom_llm_base_url = ""
custom_llm_model_name = ""
# Fallback keys share the main provider's model/url unless overridden here
# (e.g. a proxy or a cheaper standby model for when the primary key is rate-limited).
llm_fallback_api_keys = ""
llm_fallback_base_url = ""
llm_fallback_model_name = ""
# 任务终态回调（完成/失败时 POST JSON）。webhook_secret 非空时请求头携带
# X-ReelSync-Signature: HMAC-SHA256(body)。供 n8n / cron / MCP 客户端监听。
webhook_url = ""
webhook_secret = ""
ollama_base_url = ""
ollama_model_name = ""
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""
litellm_model_name = ""
groq_api_key = ""
groq_base_url = ""
groq_model_name = ""
pollinations_api_key = ""
pollinations_base_url = ""
pollinations_model_name = ""
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "请用自然、清晰、适合短视频旁白的语气朗读。"
subtitle_provider = "edge"
endpoint = ""
material_directory = ""
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""
max_concurrent_tasks = 5
max_queued_tasks = 100
# 视频编码质量：preset 控制编码速度/体积权衡（ultrafast..veryslow），
# crf 控制质量（越小越清晰，18-23 典型），video_bitrate 可选覆盖码率。
video_preset = "medium"
video_crf = 23
video_bitrate = ""
# 视频帧率：24-60，默认 30。通过 VideoParams.video_fps 或 config.video_fps 配置
video_fps = 30
# 音频响度归一化：开启后对最终混音做 loudnorm/AudioNormalize（-14 LUFS），
# 防止多轨叠加削波。默认开启；仅当你需要保留原始未处理响度时可设为 false。
audio_loudnorm = true
# 输出分辨率：1080p（默认，兼容低端设备）或 4k/2160p（需 4K 素材与更高显存/磁盘）
video_resolution = "1080p"
# 自定义成片输出目录：空值表示默认 storage/tasks/<task_id>/；
# 设置为绝对路径后，成片会额外复制到该目录（文件名含 task_id 前缀），
# 原始任务目录仍保留，方便在 WebUI/API 中预览与管理。
output_dir = ""
# 是否保留中间片段（temp-clip-*.mp4 / mix-chunk-*.mp4），默认删除以节省空间。
keep_intermediate_clips = false
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
upload_post_platforms = [ "tiktok", "instagram",]
upload_post_auto_upload = false
upload_post_youtube_privacy_status = "public"
upload_post_max_pending_tasks = 10
enable_web_scraping = true
# Web 抓取分辨率上限：1080（默认，低端设备）或 2160（4K，需更高内存与带宽）
web_scrape_max_height = 1080
web_scrape_max_filesize = "500M"
# 平台感知搜索：auto 时按关键词/LLM 选择 YouTube vs TikTok（dance/viral/tiktok/challenge/trend → TikTok），未知 extractor 自动回退到 YouTube (ytsearch)
web_scrape_search_mode = "auto"
# 水印处理：默认不移除（移除他人水印可能违反平台 ToS/版权）。仅当你拥有
# 素材版权时可设为 true，此时自动对下载的网页视频应用 ffmpeg delogo。TikTok 水印仅在此开关开启时处理，默认保持原样。
enable_watermark_removal = false
# 可选：为网页抓取结果启用 TwelveLabs 语义重排（需配置 twelvelabs_api_keys），按标题与搜索词 embedding 相似度排序
# web 搜索已内置：twelvelabs 启用时自动对标题做 embedding ranking，否则回退到 LLM ranking
gemini_base_url = ""
custom_api_video_url = "https://generativelanguage.googleapis.com/v1beta/interactions"
custom_api_image_url = "https://generativelanguage.googleapis.com/v1beta/interactions"
custom_api_provider_preset = "Google Gemini (Nano Banana / Veo)"
custom_api_video_model = "gemini-omni-flash-preview"
custom_api_image_model = "gemini-3.1-flash-image"
# 高质量免费图片源：Nano Banana（gemini-2.5-flash-image）。仅需在上方
# gemini_api_key 填一个免费 Gemini API Key 即可启用（free tier 按日配额，
# 耗尽或限流时自动回退到 pollinations 兜底，不阻塞出片）。
auto_providers = [ "gemini_image", "custom_api", "pixabay", "coverr", "web_scrape", "pollinations",]
enable_pollinations = true
cache_max_size_gb = 10
cache_max_files = 500
# 字幕渲染引擎：pil（默认，Pillow位图+2×超采样，兼容性最好）vs ass（矢量libass，需ffmpeg支持ass滤镜，清晰度更高）
subtitle_engine = "pil"

[whisper]
# small=快速/低显存，medium=平衡，large-v3-turbo=高质量/较慢（809M distilled，精度接近large-v3，4×更快，~2GB int8）
# device: cpu=强制 CPU，auto=有 CUDA 则 cuda 否则 cpu（需 torch）
model_size = "large-v3-turbo"
device = "cpu"
compute_type = "int8"

